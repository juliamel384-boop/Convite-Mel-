<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz aniversário, Mel</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--kraft:#b99566;--ink:#4a2f1d;--pw:min(45vw,calc(70dvh*.707));box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#b99566;font-family:'Caveat','Segoe Print','Bradley Hand',cursive;color:var(--ink);
background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .2  0 0 0 0 .1  0 0 0 .35 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"),
radial-gradient(ellipse at 50% 40%,#cfae7e 0%,#b99566 55%,#8f6c42 100%);}
.book{position:fixed;left:50%;top:44%;width:calc(var(--pw)*2);height:calc(var(--pw)*1.4144);perspective:2600px;
transform-origin:50% 50%;transition:transform 1s cubic-bezier(.6,0,.2,1);transform:translate(-50%,-50%) scale(var(--k,1)) translateX(-25%)}
.book.open{transform:translate(-50%,-50%) scale(var(--k2,1))}
.pg{position:absolute;top:0;width:50%;height:100%;background:#f3ead8;box-shadow:0 14px 30px rgba(50,30,10,.45),0 2px 4px rgba(0,0,0,.3)}
.pg>.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
#L{left:0;opacity:0;transition:opacity .3s .1s;pointer-events:none}
.open #L{opacity:1;transition-delay:.45s;pointer-events:auto}
#R{left:50%}
.pg::after{content:"";position:absolute;top:0;bottom:0;width:7%;pointer-events:none}
#L::after{right:0;background:linear-gradient(90deg,transparent,rgba(0,0,0,.28))}
#R::after{left:0;background:linear-gradient(270deg,transparent,rgba(0,0,0,.28))}
.tape{opacity:0;transition:opacity .3s;position:absolute;width:26%;height:5%;background:rgba(250,220,230,.72);box-shadow:0 1px 3px rgba(0,0,0,.25);z-index:3;pointer-events:none;
background-image:repeating-linear-gradient(90deg,transparent 0 6px,rgba(255,255,255,.35) 6px 9px)}
.open .tape{opacity:1;transition-delay:.9s}
.flip{position:absolute;left:50%;top:0;width:50%;height:100%;transform-origin:0 50%;transform-style:preserve-3d;z-index:6;
transition:transform 1.1s cubic-bezier(.55,0,.25,1);cursor:pointer;box-shadow:0 14px 34px rgba(50,30,10,.5)}
.open .flip{transform:rotateY(-180deg);pointer-events:none}
.flip img{width:100%;height:100%;object-fit:cover;display:block;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.hint{position:absolute;left:0;right:0;bottom:5%;text-align:center;font-size:clamp(18px,3.4vw,30px);color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.7);pointer-events:none;animation:pulse 2.2s ease-in-out infinite}
.open .hint{display:none}
@keyframes pulse{50%{opacity:.45}}
.tag{position:absolute;z-index:9;background:#f6edd9;color:#4a2f1d;font-weight:700;line-height:1.1;text-align:center;padding:.25em .7em;border-radius:3px 10px 4px 9px;
box-shadow:0 2px 0 rgba(60,35,15,.45),0 5px 10px rgba(0,0,0,.3);pointer-events:none;white-space:nowrap;transition:opacity .4s}
#coverHint{left:75%;bottom:6%;transform:translateX(-50%) rotate(-2deg);font-size:calc(var(--pw)*.095);animation:pulse 2.2s ease-in-out infinite}
.open #coverHint{opacity:0;animation:none}
.lt{left:41%;top:81%;transform:translateX(-50%) rotate(1.5deg);font-size:calc(var(--pw)*.065);opacity:0;transition:opacity .4s .9s}
.open .lt{opacity:1}.lu .lt{opacity:0;transition-delay:0s}
/* letter page */
#env{position:absolute;left:var(--el);top:var(--et);width:var(--ew);height:var(--eh);cursor:pointer;z-index:4;display:block}
#letter{position:absolute;z-index:3;cursor:pointer;filter:drop-shadow(0 4px 8px rgba(40,20,10,.4));
transition:left .7s cubic-bezier(.4,0,.2,1),top .7s cubic-bezier(.4,0,.2,1),width .7s cubic-bezier(.4,0,.2,1),transform .7s;user-select:none;-webkit-user-drag:none;transform:rotate(-2deg)}
#letter.up{z-index:9;transform:rotate(0);filter:drop-shadow(0 12px 22px rgba(40,20,10,.55))}
/* candles page */
.fl{position:absolute;transform-origin:50% 96%;pointer-events:none;z-index:2;transition:opacity .35s,filter .35s}
.fl img{width:100%;display:block;transform-origin:50% 96%;animation:flick 1.1s ease-in-out infinite alternate;animation-delay:var(--d)}
.fl.out{opacity:0;filter:blur(3px)}
.fl.out img{animation:none}
@keyframes flick{from{transform:rotate(-2.5deg) scaleY(.97)}to{transform:rotate(2.5deg) scaleY(1.04)}}
#wish{position:absolute;left:0;right:0;top:22%;text-align:center;font-size:clamp(26px,5.6vw,58px);font-weight:700;color:#fff;
text-shadow:0 2px 0 #a3322a,0 3px 10px rgba(0,0,0,.5);opacity:0;transform:translateY(12px) rotate(-3deg);transition:.6s;pointer-events:none;z-index:5;line-height:1}
#wish.show{opacity:1;transform:translateY(0) rotate(-3deg)}
#conf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
/* controls */
#hud{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:center;
padding:0 12px;opacity:0;pointer-events:none;transition:opacity .4s;z-index:20}
#hud.on{opacity:1;pointer-events:auto;transition-delay:.9s}
.btn{font:700 20px 'Caveat','Segoe Print',cursive;color:var(--ink);background:#f6edd9;border:0;padding:8px 18px;border-radius:3px 12px 4px 10px;
box-shadow:0 3px 0 rgba(60,35,15,.45),0 6px 10px rgba(0,0,0,.25);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.btn:active,.btn.hold{transform:translateY(2px);box-shadow:0 1px 0 rgba(60,35,15,.45)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
#relight{display:none;background:#f9d9e0}
#meter{width:110px;height:12px;border-radius:6px;background:rgba(60,35,15,.35);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
#bar{height:100%;width:0;background:linear-gradient(90deg,#9bbf5a,#f3c24f,#e0524a)}
#mic{font-size:18px;color:#fff6e4;text-shadow:0 1px 3px rgba(0,0,0,.6);max-width:92vw;text-align:center}
@media (prefers-reduced-motion:reduce){.book,.flip,#letter{transition-duration:.01s}.fl img,.hint{animation:none}}
</style></head><body>

const book=$('book'),L=$('letter'),envEl=$('env'),Lp=$('L'),flames=$('flames');
let isOpen=false,letterUp=false,lit=true,level=0,manual=0,blowT=0,audio=null,micOK=false,raf=0;
/* sizing */
function size(){const vw=innerWidth,vh=innerHeight,pw=Math.min(.45*vw,.7*vh*.707);
 book.style.setProperty('--pw',pw+'px');
 const k=Math.min(.8*vw/pw,.74*vh/(pw*1.4144),2.2);book.style.setProperty('--k',Math.max(k,1));
 book.style.setProperty('--k2',1);
 const e=CFG.env;for(const[n,v]of[['l','el'],['t','et'],['w','ew'],['h','eh']])Lp.style.setProperty('--'+v,e[n]+'%');
 layoutLetter();}
function layoutLetter(){const w=Lp.clientWidth,h=Lp.clientHeight,e=CFG.env;
 if(letterUp){const lw=w*.86;L.style.width=lw+'px';L.style.left=(w-lw)/2+'px';L.style.top=(h-lw/CFG.lw)/2+'px'}
 else{const lw=w*e.w/100*.62,cx=w*(e.l+e.w/2)/100;L.style.width=lw+'px';L.style.left=cx-lw/2+'px';L.style.top=h*e.t/100-lw/CFG.lw*.19+'px'}}
addEventListener('resize',size);
function toggleLetter(){letterUp=!letterUp;
 if(letterUp){L.classList.add('up');envEl.style.pointerEvents='none'}
 else{L.classList.remove('up');setTimeout(()=>{envEl.style.pointerEvents=''},700)}
 Lp.classList.toggle('lu',letterUp);layoutLetter();}
L.onclick=toggleLetter;envEl.onclick=toggleLetter;
/* flames */
FL.forEach((f,i)=>{const d=document.createElement('div');d.className='fl';d.style.cssText=`left:${f.l}%;top:${f.t}%;width:${f.w}%`;
 d.style.setProperty('--d',(-i*.37)+'s');d.innerHTML=`<img src="${f.src}" alt="">`;flames.appendChild(d);f.el=d;f.k=.75+((i*37)%10)/20});
/* open / close */
function open(){if(isOpen)return;isOpen=true;book.classList.add('open');$('hud').classList.add('on');startMic();loop()}
function close(){isOpen=false;if(letterUp)toggleLetter();book.classList.remove('open');$('hud').classList.remove('on');cancelAnimationFrame(raf)}
$('flip').onclick=open;$('flip').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};
$('back').onclick=close;
/* mic */
async function startMic(){if(audio)return;const m=$('mic');
 try{if(!navigator.mediaDevices||!window.isSecureContext)throw new Error('insecure');
  const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  const ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();
  const an=ctx.createAnalyser();an.fftSize=1024;const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1500;
  ctx.createMediaStreamSource(st).connect(lp);lp.connect(an);
  audio={an,buf:new Float32Array(an.fftSize),floor:null,n:0};micOK=true;m.textContent='sopre no microfone 🎤 (ou segure o botão / barra de espaço)'}
 catch(e){micOK=false;m.textContent='Microfone indisponível (precisa de https e permissão). Use o botão ou a barra de espaço.'}}
function micLevel(){if(!audio)return 0;audio.an.getFloatTimeDomainData(audio.buf);let s=0;for(const v of audio.buf)s+=v*v;const r=Math.sqrt(s/audio.buf.length);
 if(audio.floor===null){audio.floor=r;audio.n=1}else if(audio.n<30){audio.floor=(audio.floor*audio.n+r)/++audio.n}else if(r<audio.floor*1.5)audio.floor=audio.floor*.98+r*.02;
 return Math.min(1,Math.max(0,(r-audio.floor*1.5-.01)/.12))}
/* manual blow */
const hold=$('hold');const setM=v=>{manual=v;hold.classList.toggle('hold',!!v)};
hold.addEventListener('pointerdown',e=>{e.preventDefault();hold.setPointerCapture(e.pointerId);setM(1)});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>hold.addEventListener(t,()=>setM(0)));
addEventListener('keydown',e=>{if(e.code==='Space'&&isOpen){e.preventDefault();if(!e.repeat)setM(1)}});
addEventListener('keyup',e=>{if(e.code==='Space')setM(0)});
/* loop */
let last=performance.now(),bend=0;
function loop(){raf=requestAnimationFrame(loop);const now=performance.now(),dt=(now-last)/1000;last=now;
 const target=Math.max(micLevel(),manual*.85+(manual?.1*Math.sin(now/60):0));
 level+=(target-level)*Math.min(1,dt*14);bend+=(level-bend)*Math.min(1,dt*8);
 $('bar').style.width=Math.round(level*100)+'%';
 if(lit){FL.forEach(f=>{const b=bend;f.el.style.transform=`rotate(${b*55*f.k}deg) skewX(${-b*18*f.k}deg) scaleY(${1-b*.18})`});
  if(level>.35)blowT+=dt;else blowT=Math.max(0,blowT-dt*1.5);
  if(blowT>=.5)blowOut()}}
function blowOut(){lit=false;blowT=0;FL.forEach((f,i)=>setTimeout(()=>f.el.classList.add('out'),i*45));
 setTimeout(()=>{$('relight').style.display='inline-block';confetti()},350)}
$('relight').onclick=()=>{lit=true;blowT=0;$('relight').style.display='none';FL.forEach(f=>{f.el.classList.remove('out');f.el.style.transform=''})};
/* confetti */
function confetti(){const c=$('conf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const cols=['#e8588a','#f3c24f','#7aa63c','#f08a4b','#fff3e0','#c0408f'];
 const r=Lp.getBoundingClientRect(),R=$('R').getBoundingClientRect(),ox=R.left+R.width/2,oy=R.top+R.height*.3;
 const p=Array.from({length:150},()=>({x:ox,y:oy,vx:(Math.random()-.5)*16,vy:-Math.random()*14-3,w:5+Math.random()*7,h:3+Math.random()*5,a:Math.random()*6,va:(Math.random()-.5)*.4,c:cols[Math.random()*6|0]}));
 let t=0;(function f(){x.clearRect(0,0,c.width,c.height);t++;let alive=0;
  p.forEach(q=>{q.vy+=.28;q.vx*=.99;q.x+=q.vx;q.y+=q.vy;q.a+=q.va;if(q.y<c.height+20)alive++;x.save();x.translate(q.x,q.y);x.rotate(q.a);x.fillStyle=q.c;x.fillRect(-q.w/2,-q.h/2,q.w,q.h);x.restore()});
  if(alive&&t<400)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
size();
